name: Make release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-for-github:
    name: Release for GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve and validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_tag="${GITHUB_REF#refs/tags/}"
          else
            version_tag="${{ inputs.tag_name }}"
          fi

          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $version_tag"
            exit 1
          fi
          echo "VERSION_TAG=$version_tag" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build selected release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleStandardRelease --stacktrace --no-daemon --max-workers=2
          ./gradlew assembleFongmiRelease --stacktrace --no-daemon --max-workers=2
          ./gradlew assembleNoVulkanRelease --stacktrace --no-daemon --max-workers=2

      - name: Sign and verify release APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [[ -z "${{ secrets.SIGNING_KEYSTORE }}" || -z "${{ secrets.SIGNING_KEY_ALIAS }}" || -z "${{ secrets.SIGNING_STORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "Stable releases require all signing secrets."
            exit 1
          fi
          test -x "$apksigner"

          printf '%s' "${{ secrets.SIGNING_KEYSTORE }}" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT

          sign_apk() {
            local unsigned="$1"
            local signed="$2"
            local label="$3"
            if [[ ! -f "$unsigned" ]]; then
              echo "Missing expected $label APK: $unsigned"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed" \
              "$unsigned"
            "$apksigner" verify --verbose "$signed"
            rm -f "$unsigned"
          }

          release_dir="app/build/outputs/apk/standard/release"
          test -d "$release_dir"
          architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${architectures[@]}"; do
            sign_apk \
              "$release_dir/app-standard-${abi}-release-unsigned.apk" \
              "$release_dir/app-standard-${abi}-release.apk" \
              "standard $abi release"
          done

          flavor_dir="app/build/outputs/apk/fongmi/release"
          test -d "$flavor_dir"
          sign_apk \
            "$flavor_dir/app-fongmi-universal-release-unsigned.apk" \
            "$flavor_dir/app-fongmi-universal-release.apk" \
            "fongmi universal release"

          flavor_dir="app/build/outputs/apk/noVulkan/release"
          test -d "$flavor_dir"
          sign_apk \
            "$flavor_dir/app-noVulkan-universal-release-unsigned.apk" \
            "$flavor_dir/app-noVulkan-universal-release.apk" \
            "non-Vulkan universal release"

      - name: Stage release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          : > checksums.txt

          release_dir="app/build/outputs/apk/standard/release"
          architectures=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for abi in "${architectures[@]}"; do
            src="$release_dir/app-standard-${abi}-release.apk"
            dst="release-assets/Replay-${abi}-${VERSION_TAG}.apk"
            test -f "$src"
            cp "$src" "$dst"
            sha256sum "$dst" | tee -a checksums.txt
          done

          src="app/build/outputs/apk/fongmi/release/app-fongmi-universal-release.apk"
          dst="release-assets/Replay-fongmi-${VERSION_TAG}.apk"
          test -f "$src"
          cp "$src" "$dst"
          sha256sum "$dst" | tee -a checksums.txt

          src="app/build/outputs/apk/noVulkan/release/app-noVulkan-universal-release.apk"
          dst="release-assets/Replay-no-vulkan-${VERSION_TAG}.apk"
          test -f "$src"
          cp "$src" "$dst"
          sha256sum "$dst" | tee -a checksums.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          section = []
          in_latest = False
          for line in changelog:
              if line.startswith('## '):
                  if in_latest:
                      break
                  in_latest = True
              if in_latest:
                  section.append(line)

          latest = '\n'.join(section).strip()
          if not latest:
              raise SystemExit('Could not find latest changelog section')
          Path('release-notes.md').write_text(latest + '\n\n---\n### SHA-256 checksums\n\n```text\n', encoding='utf-8')
          PY
          cat checksums.txt >> release-notes.md
          printf '%s\n' '```' >> release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Replay ${{ env.VERSION_TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-release-pages:
    name: Publish updated site
    needs: release-for-github
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: replay-preview-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/downloads site/releases
          cp fastlane/metadata/android/preview-site/index.html site/index.html
          cp fastlane/metadata/android/en-US/images/icon.png site/icon.png
          cp fastlane/metadata/android/preview-site/site.webmanifest site/site.webmanifest
          cp fastlane/metadata/android/preview-site/releases/index.html site/releases/index.html
          touch site/.nojekyll

      - name: Preserve existing preview build data
        shell: bash
        run: |
          set -uo pipefail
          if curl -fsSL "https://utsavrajputt.github.io/Replay/latest.json" -o site/latest.json; then
            echo "Existing preview manifest found, re-publishing it alongside the release update."
          else
            echo "No existing preview manifest found yet; preview tab will show offline until the next Preview Build run."
            rm -f site/latest.json
          fi

      - name: Re-download preserved preview APKs
        shell: bash
        run: |
          set -uo pipefail
          if [[ -f site/latest.json ]]; then
            jq -r '.assets[]?.browser_download_url // empty' site/latest.json | while read -r url; do
              name="$(basename "$url")"
              curl -fsSL "$url" -o "site/downloads/$name" || echo "Warning: could not preserve $name, link may 404 until the next Preview Build run."
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
